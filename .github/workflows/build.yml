name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and build universal macOS app
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            version="${REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a tag such as v0.1.0'; exit 1; }
            [[ "$version" == "$(cat VERSION)" ]] || { echo 'Tag must match VERSION'; exit 1; }
          fi
      - name: Test
        run: swift test
      - name: Package app
        run: ./scripts/package-release.sh
      - name: Upload downloadable build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Cropper-macOS
          path: build/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Cropper-macOS
          path: release
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## Download
          Download **Cropper-…-universal.zip**, unzip it, and drag Cropper.app into Applications.
          Requires macOS 14 or newer. Supports Apple Silicon and Intel Macs. No runtime dependencies or internet connection required.

          This build is ad-hoc signed and **not notarized**. macOS may block the first launch. See the README's installation instructions. Originals are preserved by default.

          `SHA256SUMS.txt` contains the archive checksum.
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --draft --title "Cropper $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
